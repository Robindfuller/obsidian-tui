[package]
name = "obsidian-tui"
version = "0.1.0"
edition = "2024"
description = "An Obsidian vault in the terminal: sidebar, notes, rendered Markdown, links and search"
license = "MIT"
repository = "https://github.com/Robindfuller/obsidian-tui"

[[bin]]
name = "obsidian-tui"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
pulldown-cmark = { version = "0.13", default-features = false }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
toml = "1"
unicode-width = "0.2"
base64 = "0.22"
regex = "1"
percent-encoding = "2"
serde_json = "1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
